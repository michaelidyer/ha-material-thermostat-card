name: Experimental ducted card bundle

on:
  push:
    branches:
      - feature/ducted-zones
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package*.json'
      - 'rollup.config.mjs'
      - '.github/workflows/ducted-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    name: Typecheck and build downloadable HA resource
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build JavaScript bundles
        run: npm run build
      - name: Verify experimental resource exists
        run: test -s dist/material-ducted-thermostat-card.js
      - name: Upload Home Assistant test resource
        uses: actions/upload-artifact@v4
        with:
          name: material-ducted-thermostat-card
          path: dist/material-ducted-thermostat-card.js
          if-no-files-found: error
          retention-days: 14
