name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

jobs:
  hacs:
    name: HACS validation
    # Fork metadata (Issues/topics) has not been configured yet. Validate HACS
    # on main; keep feature PRs gated by lint, typecheck, build and tests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: plugin

  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Ensure dist is committed and up to date
        run: |
          if ! git diff --quiet -- dist/material-thermostat-card.js; then
            echo "::error::The original material-thermostat-card.js bundle is out of date."
            git --no-pager diff --stat -- dist/material-thermostat-card.js
            exit 1
          fi
